services:
  db: 
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment: 
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: PXL_Healthcare_DB
    volumes:
      - Healthcaredata:/var/lib/postgresql/data


volumes:
  Healthcaredata:
