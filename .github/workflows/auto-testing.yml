name: Automated Tests

on:
  push:
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests (JUnit / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'Api/pom.xml'

      - name: Make Maven wrapper executable
        run: chmod +x Api/mvnw

      - name: Run JUnit Tests
        working-directory: Api
        run: ./mvnw clean test

      - name: Upload Backend Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: Api/target/surefire-reports/
          if-no-files-found: ignore

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Run Vitest Tests
        working-directory: Frontend
        # Runs the 'test' script in package.json (e.g. "test": "vitest run").
        # Using --if-present allows CI to succeed until the test script is added.
        run: npm test --if-present
