name: SonarQube Azure Scan

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sonar:
    name: SonarQube Quality & Coverage Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'Api/pom.xml'

      - name: Run Backend Tests, Copy Libraries & Generate JaCoCo Report
        working-directory: ./Api
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw clean test dependency:copy-dependencies -DoutputDirectory=target/dependency -B
          else
            mvn clean test dependency:copy-dependencies -DoutputDirectory=target/dependency -B
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install Frontend Dependencies & Generate Vitest Coverage
        working-directory: ./Frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: |
          npm ci
          npx vitest run --exclude "**/e2e/**" --coverage.enabled=true --coverage.provider=v8 --coverage.reporter=lcov --coverage.reportsDirectory=coverage
          # Zorg dat de paden in lcov.info kloppen met de repo root (Frontend/src/ i.p.v. src/)
          sed -i 's|^SF:src/|SF:Frontend/src/|g' coverage/lcov.info

      - name: Wake up SonarQube Container App
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          BASE_URL="${SONAR_HOST_URL%/}"
          if [ -z "$BASE_URL" ]; then
            echo "SONAR_HOST_URL secret is niet ingesteld."
            exit 1
          fi

          echo "SonarQube opstarten en wachten tot /api/system/status UP is..."
          DEADLINE=$((SECONDS + 300))
          ATTEMPT=1
          RESPONSE=""
          while [ $SECONDS -lt $DEADLINE ]; do
            RESPONSE=$(curl -sS --max-time 35 "${BASE_URL}/api/system/status" || true)
            STATUS=$(echo "$RESPONSE" | grep -o '"status":"[^"]*"' || true)
            echo "Poging ${ATTEMPT} (${SECONDS}s): ${STATUS:-geen antwoord}"
            if [ "$STATUS" = '"status":"UP"' ]; then
              echo "SonarQube is klaar!"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep 5
          done
          echo "Timeout na 300s tijdens wachten op SonarQube. Laatste response: ${RESPONSE}"
          exit 1

      - name: Run SonarQube Scan to Azure
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=pxl-healthcare
            -Dsonar.sources=Api/src/main/java,Frontend/src
            -Dsonar.tests=Api/src/test/java,Frontend/src
            -Dsonar.java.binaries=Api/target/classes
            -Dsonar.java.test.binaries=Api/target/test-classes
            -Dsonar.java.libraries=Api/target/dependency/*.jar
            -Dsonar.java.test.libraries=Api/target/dependency/*.jar
            -Dsonar.coverage.jacoco.xmlReportPaths=Api/target/site/jacoco/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/coverage/**,**/*.min.js,Frontend/src/**/*.test.ts,Frontend/src/**/*.spec.ts
            -Dsonar.test.inclusions=Api/src/test/java/**,Frontend/src/**/*.test.ts,Frontend/src/**/*.spec.ts
