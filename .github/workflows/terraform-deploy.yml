name: "Terraform - Deploy Database (Thu & Fri)"

on:
  schedule:
    # Elke donderdag en vrijdag om 07:00 UTC (08:00 CET / 09:00 CEST).
    # Hierdoor is de database ruim voor 08:30 klaar voor gebruik.
    - cron: '0 7 * * 4,5'
  workflow_dispatch: # Hiermee kun je de database handmatig starten met 1 klik in GitHub

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: "Deploy Azure PostgreSQL"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_USE_OIDC: "true"
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP || 'rg-healthcare-dev' }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER || 'tfstate' }}" \
            -backend-config="key=healthcare.database.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      - name: Publish Connection Summary
        if: success()
        run: |
          DB_HOST=$(terraform output -raw host)
          DB_NAME=$(terraform output -raw database)
          DB_USER=$(terraform output -raw user)
          JDBC_URL=$(terraform output -raw jdbc_url)

          echo "### 🚀 Azure Database Ready!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Host:** \`$DB_HOST\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Port:** \`5432\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Database:** \`$DB_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **User:** \`$DB_USER\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Spring Boot Configuration (\`application.properties\`):" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`properties" >> $GITHUB_STEP_SUMMARY
          echo "spring.datasource.url=$JDBC_URL" >> $GITHUB_STEP_SUMMARY
          echo "spring.datasource.username=$DB_USER" >> $GITHUB_STEP_SUMMARY
          echo "spring.datasource.password=\${DB_PASSWORD}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
